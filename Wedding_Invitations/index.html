<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#111111">
    <title>Wedding Invitation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="iphone-shell" aria-label="Wedding Invitation">
        <!-- [1] 잠금 화면 -->
        <section class="screen lock-screen" id="lockScreen" aria-label="잠금 화면">
            <div class="lock-widgets">
                <div class="lock-date" id="lockDate">2026년 12월 19일 토요일</div>
                <div class="lock-clock cover-title">Wedding</div>
                <div class="lock-couple">재훈 ♥ 희은</div>
                <div class="lock-dday" id="weddingDday">WEDDING D-DAY ♥</div>
            </div>

            <div class="notification-card" role="button" tabindex="0" id="notificationOpenBtn">
                <div class="notification-top">
                    <span>💌 청첩장</span>
                    <span>now</span>
                </div>
                <strong>저희 결혼식에 초대합니다</strong>
                <p>위로 쓸어올려 초대장을 열어주세요.</p>
            </div>

            <div class="home-bar-wrapper lock-home-guide">
                <div class="home-bar-hint">위로 쓸어올려서 열기</div>
                <div class="home-bar interactive" id="lockHomeBar"></div>
            </div>
        </section>

        <!-- [2] 홈 화면 -->
        <section class="screen home-screen" id="homeScreen" aria-label="홈 화면">
            <div class="home-widget">
                <div class="widget-top-row">
                    <span class="widget-kicker">Wedding Day</span>
                    <span class="widget-heart-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </span>
                </div>
                <div class="widget-names">재훈 &amp; 희은</div>
                <div class="widget-date-row">
                    <span class="widget-date">2026.12.19 SAT</span>
                    <span class="widget-sep">·</span>
                    <span class="widget-time">오후 5시</span>
                </div>
                <div class="widget-dday-row">
                    <span class="widget-dday-label" id="widgetDday">D-???</span>
                </div>
            </div>

            <div class="app-container">
                <div class="app-grid">
                    <!-- <button class="app-icon" type="button" data-app="story">
                        <span class="icon-shape bg-heart">❤️</span>
                        <span class="app-label">우리 이야기</span>
                    </button> -->
                    <button class="app-icon" type="button" data-app="gallery">
                        <span class="icon-shape bg-gallery photo-app-icon">
                            <span class="photo-rectangle orange"></span>
                            <span class="photo-rectangle yellow"></span>
                            <span class="photo-rectangle green"></span>
                            <span class="photo-rectangle lightBlue"></span>
                            <span class="photo-rectangle blue"></span>
                            <span class="photo-rectangle purple"></span>
                            <span class="photo-rectangle violet"></span>
                            <span class="photo-rectangle red"></span>
                        </span>
                        <span class="app-label">갤러리</span>
                    </button>
                    <button class="app-icon" type="button" data-app="map">
                        <span class="icon-shape bg-map map-app-icon">
                            <span class="map-area map-area-green"></span>
                            <span class="map-area map-area-pink"></span>
                            <span class="map-area map-area-yellow"></span>
                            <span class="map-area map-area-gray"></span> 
                            <span class="map-area map-area-white"></span>
                            <span class="map-road map-road-1"></span>
                            <span class="map-road map-road-2"></span>
                            <span class="map-road map-road-3"></span>
                            <span class="map-navigation"></span>
                        </span>
                        <span class="app-label">오시는길</span>
                    </button>
                    <button class="app-icon" type="button" data-app="mail">
                        <span class="icon-shape bg-mail mail-app-icon">
                            <span class="mail-envelope">
                                <span class="mail-line-top"></span>
                                <span class="mail-line mail-line-left"></span>
                                <span class="mail-line mail-line-right"></span>
                            </span>
                        </span>
                        <span class="app-label">축의금</span>
                    </button>
                    <button class="app-icon" type="button" data-app="schedule">
                        <span class="icon-shape bg-calendar calendar-app-icon">
                            <span class="calendar-header"></span>

                            <span class="calendar-row row-1"></span>
                            <span class="calendar-row row-2"></span>
                            <span class="calendar-row row-3"></span>
                            <span class="calendar-row row-4"></span>

                            <span class="calendar-dot active"></span>
                        </span>
                        <span class="app-label">예식일정</span>
                    </button>
                    <button class="app-icon" type="button" data-app="guestbook">
                        <span class="icon-shape bg-guest guestbook-app-icon">
                            <svg class="app-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.84 1.83 3.75 3.75M3 17.25V21h3.75L17.81 9.93l-3.75-3.75L3 17.25z"/></svg>
                        </span>
                        <span class="app-label">방명록</span>
                    </button>
                </div>
            </div>

            <div class="dock-wrapper">
                <div class="dock">
                    <button class="app-icon" type="button" data-app="gallery">
                        <span class="icon-shape bg-gallery photo-app-icon">
                            <span class="photo-rectangle orange"></span>
                            <span class="photo-rectangle yellow"></span>
                            <span class="photo-rectangle green"></span>
                            <span class="photo-rectangle lightBlue"></span>
                            <span class="photo-rectangle blue"></span>
                            <span class="photo-rectangle purple"></span>
                            <span class="photo-rectangle violet"></span>
                            <span class="photo-rectangle red"></span>
                        </span>
                        <span class="app-label">갤러리</span>
                    </button>
                    <button class="app-icon" type="button" data-app="map">
                        <span class="icon-shape bg-map map-app-icon">
                            <span class="map-area map-area-green"></span>
                            <span class="map-area map-area-pink"></span>
                            <span class="map-area map-area-yellow"></span>
                            <span class="map-area map-area-gray"></span> 
                            <span class="map-area map-area-white"></span>
                            <span class="map-road map-road-1"></span>
                            <span class="map-road map-road-2"></span>
                            <span class="map-road map-road-3"></span>
                            <span class="map-navigation"></span>
                        </span>
                        <span class="app-label">오시는길</span>
                    </button>
                    <button class="app-icon" type="button" data-app="guestbook">
                        <span class="icon-shape bg-guest guestbook-app-icon">
                            <svg class="app-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.84 1.83 3.75 3.75M3 17.25V21h3.75L17.81 9.93l-3.75-3.75L3 17.25z"/></svg>
                        </span>
                        <span class="app-label">방명록</span>
                    </button>
                    <button class="app-icon" type="button" data-app="share">
                        <span class="icon-shape bg-share share-app-icon">
                            <svg class="app-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
                        </span>
                        <span class="app-label">공유</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- [3] 실제 앱 구동 내부 레이어 -->
        <section class="app-window" id="appWindow" aria-hidden="true">
            <header class="app-header">
                <button class="ios-back-btn" id="closeAppBtn" type="button" aria-label="홈 화면으로 돌아가기">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
                    홈
                </button>
                <span id="appTitle">앱 이름</span>
                <div class="header-spacer" aria-hidden="true"></div>
            </header>
            <div class="app-content" id="appContent" tabindex="0"></div>
            <div class="home-bar-wrapper">
                <div class="home-bar home-bar-dark" id="appHomeBar"></div>
            </div>
        </section>
    </main>
    <script src="//dapi.kakao.com/v2/maps/sdk.js?appkey=af5f5b7dcb9deebbaa2b737f88875934&libraries=services"></script>
    <script src="./script.js?v=20260520-mobile-clean"></script>
</body>
</html>
